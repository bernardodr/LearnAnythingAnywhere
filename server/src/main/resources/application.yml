spring:
  application:
    name: laa-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/laa}
    username: ${DATABASE_USER:laa}
    password: ${DATABASE_PASSWORD:laa}
  flyway:
    locations: classpath:db/migration
  mail:
    # The SMTP server comes from SPRING_MAIL_HOST / _PORT / _USERNAME / _PASSWORD (./dev.sh points at Mailpit).
    # Without SPRING_MAIL_HOST the server refuses to start, unless LAA_MAIL_OUTBOX=true (laa.mail.outbox below).
    # Port 465 (TLS from the start, e.g. Cloudflare) needs SPRING_MAIL_SSL_ENABLED=true; 587 upgrades with STARTTLS.
    properties:
      mail.smtp.starttls.enable: true                       # used when the server offers it
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}   # set true for a real provider
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  # Behind a proxy (Caddy, in production), the client's address is the last one in X-Forwarded-For. Tomcat trusts
  # that header only on a connection from an internal proxy: by default a private or loopback address, which is all
  # a Docker network or this machine can be. From anyone else it's ignored, so it can't be forged to dodge the sign-in
  # throttle or the sign-up limit. Narrow the list with SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (CIDRs).
  forward-headers-strategy: native

logging:
  level:
    # Logs every failed stream at ERROR; the gateway already logs these (redacted) as a fallback warning.
    org.springframework.ai.chat.model.MessageAggregator: "off"

laa:
  app-url: ${LAA_APP_URL:http://localhost:8081}   # where links in emails point (the web app)

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}

  web:
    max-request-size: 256KB              # bigger request bodies get 413; every LAA request is short text

  mail:
    from: ${LAA_MAIL_FROM:Learn Anything Anywhere <no-reply@localhost>}
    outbox: ${LAA_MAIL_OUTBOX:false}   # no SMTP server: keep emails in memory (tests, local runs without Mailpit)

  auth:
    jwt-secret: ${JWT_SECRET:}            # HS256; at least 32 bytes (openssl rand -hex 32)
    token-ttl: 12h
    owner-emails: ${LAA_OWNER_EMAILS:owner@laa.dev}   # the only emails that may be OWNER
    owner-setup-code: ${LAA_OWNER_SETUP_CODE:}       # signing up with an owner email needs it; unset = they can't sign up
    dev-login-enabled: ${LAA_DEV_LOGIN:false}        # email-only sign-in, for local development; ./dev.sh turns it on

  dev:
    endpoints-enabled: ${LAA_DEV_ENDPOINTS:false}   # /dev/** (OWNER only): gateway ping, practice-provider failures; ./dev.sh turns it on

  llm:
    default-provider: ${LAA_DEFAULT_PROVIDER:}       # seeds an empty DB only (required then); the owner console decides after that
    practice-providers: ${LAA_PRACTICE_PROVIDERS:false}  # FAKE and FAKE_B, for local development and tests; ./dev.sh turns it on
    # The only sites a web search may look at for a reader in child-safe mode (finding lesson sources, issue #82), and
    # the only ones such a reader's lessons may list. Bare domains; subdomains count (www.nasa.gov is on nasa.gov).
    child-safe-search-domains:
      - wikipedia.org
      - britannica.com
      - nationalgeographic.com
      - natgeokids.com
      - nasa.gov
      - noaa.gov
      - nps.gov
      - si.edu
      - smithsonianmag.com
      - khanacademy.org
      - bbc.co.uk
      - nhm.ac.uk
      - rmg.co.uk
      - sciencemuseum.org.uk
      - britishmuseum.org
      - metmuseum.org
      - amnh.org
      - dkfindout.com
      - ducksters.com
    limits:                                # daily caps on estimated spend (USD), reset at midnight UTC
      learner-daily-usd: ${LAA_LEARNER_DAILY_USD:1.00}
      total-daily-usd: ${LAA_TOTAL_DAILY_USD:25.00}
    route-cache-ttl: 30s
    call-timeout: 120s                     # per provider attempt; a route can override with params.timeoutMs
    first-token-timeout: 30s               # streaming: give up on a provider that hasn't started answering
    # web-search: the model can search the web with its provider's own tool (the RESEARCH task needs it); Anthropic
    # charges USD 10 per 1,000 searches plus tokens (platform.claude.com web search tool docs, checked 2026-11-26).
    # Model IDs and prices checked against each provider's docs on 2026-11-01. Prices are USD per 1M tokens,
    # used only for the rough cost estimate in model_runs. The first model of each tier is that tier's default.
    providers:
      ANTHROPIC:
        api-key: ${ANTHROPIC_API_KEY:}
        max-retries: 1
        models:
          - { id: claude-opus-5-5,   label: Claude Opus 5.5,   tier: LARGE, structured-output: true, tool-calling: true, streaming: true, web-search: true, max-context: 1000000, input-per-mtok: 4.00, output-per-mtok: 20.00, web-search-per-1k: 10.00 }
          - { id: claude-sonnet-5-5, label: Claude Sonnet 5.5, tier: LARGE, structured-output: true, tool-calling: true, streaming: true, web-search: true, max-context: 1000000, input-per-mtok: 2.00, output-per-mtok: 10.00, web-search-per-1k: 10.00 }
          - { id: claude-haiku-5-5,  label: Claude Haiku 5.5,  tier: SMALL, structured-output: true, tool-calling: true, streaming: true, web-search: true, max-context: 1000000, input-per-mtok: 0.10, output-per-mtok: 0.50, web-search-per-1k: 10.00 }
      OPENAI:
        api-key: ${OPENAI_API_KEY:}
        max-retries: 1
        models:
          - { id: gpt-6.1-sol,   label: GPT-6.1 Sol,   tier: LARGE, structured-output: true, tool-calling: true, streaming: true, max-context: 1050000, input-per-mtok: 2.00,  output-per-mtok: 10.00 }
          - { id: gpt-6-astra,   label: GPT-6 Astra,   tier: LARGE, structured-output: true, tool-calling: true, streaming: true, max-context: 1050000, input-per-mtok: 10.00, output-per-mtok: 50.00 }
          # GPT-6.2 Sol and Astra: checked against OpenAI's model pages on 2026-11-18. Reasoning models (OpenAI refuses effort
          # "none"; LAA sets no effort, so OpenAI's default applies). After the older ones, so the LARGE default stays 6.1 Sol.
          - { id: gpt-6.2-sol,   label: GPT-6.2 Sol,   tier: LARGE, structured-output: true, tool-calling: true, streaming: true, max-context: 1050000, input-per-mtok: 2.00,  output-per-mtok: 10.00 }
          - { id: gpt-6.2-astra, label: GPT-6.2 Astra, tier: LARGE, structured-output: true, tool-calling: true, streaming: true, max-context: 1050000, input-per-mtok: 8.00,  output-per-mtok: 40.00 }
          - { id: gpt-6-luna,    label: GPT-6 Luna,    tier: SMALL, structured-output: true, tool-calling: true, streaming: true, max-context: 1050000, input-per-mtok: 0.10,  output-per-mtok: 0.50 }
          - { id: gpt-6.1-terra, label: GPT-6.1 Terra, tier: SMALL, structured-output: true, tool-calling: true, streaming: true, max-context: 1050000, input-per-mtok: 1.00,  output-per-mtok: 5.00 }
      GOOGLE:
        api-key: ${GEMINI_API_KEY:}
        max-retries: 1
        models:
          - { id: gemini-4-argon,        label: Gemini 4 Argon,        tier: LARGE, structured-output: true, tool-calling: true, streaming: true, max-context: 1000000, input-per-mtok: 4.00, output-per-mtok: 20.00 }
          - { id: gemini-3.6-flash,      label: Gemini 3.6 Flash,      tier: LARGE, structured-output: true, tool-calling: true, streaming: true, max-context: 1000000, input-per-mtok: 1.50, output-per-mtok: 7.50 }
          - { id: gemini-3.5-flash-lite, label: Gemini 3.5 Flash-Lite, tier: SMALL, structured-output: true, tool-calling: true, streaming: true, max-context: 1000000, input-per-mtok: 0.30, output-per-mtok: 2.50 }
      OLLAMA:
        base-url: ${OLLAMA_BASE_URL:}
        enabled: false                     # optional; the owner enables it once a local model is pulled
        models:
          - { id: "gpt-oss:20b", label: gpt-oss 20B (local), tier: LARGE, structured-output: true, tool-calling: true,  streaming: true, max-context: 128000 }
          - { id: "gemma3:4b",   label: Gemma 3 4B (local),  tier: SMALL, structured-output: true, tool-calling: false, streaming: true, max-context: 128000 }
      FAKE:
        models:
          - { id: fake-large, label: Fake large, tier: LARGE, structured-output: true, tool-calling: true,  streaming: true, web-search: true, max-context: 1000000 }
          - { id: fake-small, label: Fake small, tier: SMALL, structured-output: true, tool-calling: false, streaming: true, max-context: 1000000 }
      FAKE_B:
        models:
          - { id: fake-b-large, label: Fake B large, tier: LARGE, structured-output: true, tool-calling: true,  streaming: true, web-search: true, max-context: 1000000 }
          - { id: fake-b-small, label: Fake B small, tier: SMALL, structured-output: true, tool-calling: false, streaming: true, max-context: 1000000 }
