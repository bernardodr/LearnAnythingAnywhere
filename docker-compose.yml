services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: laa
      POSTGRES_USER: laa
      POSTGRES_PASSWORD: laa
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laa -d laa"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local email: catches everything LAA sends (verification and reset links). Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  pgdata:
